receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape Prometheus metrics from the orchestrator /metrics endpoint
  prometheus:
    config:
      scrape_configs:
        - job_name: ace-orchestrator
          scrape_interval: 15s
          static_configs:
            - targets: [orchestrator:8080]
          metrics_path: /metrics

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  # Forward traces to VictoriaTraces via OTLP HTTP
  otlphttp/victoriatraces:
    endpoint: http://victoriatraces:10428/insert/opentelemetry
    tls:
      insecure: true

  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victoriatraces, debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite, debug]
