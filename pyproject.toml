[project]
name = "ace-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    "langgraph-checkpoint-aws>=0.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "chainlit>=1.1",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-sdk-extension-aws>=2.0",
    "opentelemetry-propagator-aws-xray>=1.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "langfuse>=3.0",
    "boto3>=1.34",
    "pydantic>=2.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that invoke external tools or subprocesses (e.g. cfn-lint)",
]
